          type: string
          format: date-time
        request_params:
          type: object
          additionalProperties: true
          nullable: true
        request_uri:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        request_session:
          type: object
          additionalProperties: true
          nullable: true
        trace:
          type: array
          items:
            type: string
        context:
          type: object
          additionalProperties: true

    ErrorsListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/Error'
          required:
            - errors
      required:
        - header
        - results

    AnomalyEvent:
      type: object
      properties:
        id:
          type: integer
        metric:
          type: string
        endpoint:
          type: string
          nullable: true
        direction:
          type: string
          enum: [high, low]
        severity:
          type: string
          enum: [warning, critical]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
        z_score:
          type: number
        current_value:
          type: number
        baseline_value:
          type: number
        multiplier:
          type: number
          nullable: true
        open:
          type: boolean
        description:
          type: string
        smart_monitor_id:
          type: integer
          nullable: true
        deploy_id:
          type: integer
          nullable: true

    AnomalyEventDetail:
      allOf:
        - $ref: '#/components/schemas/AnomalyEvent'
        - type: object
          properties:
            baseline_std_dev:
              type: number
              nullable: true
            duration_minutes:
              type: integer
              nullable: true
            smart_monitor:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                name:
                  type: string
                kind:
                  type: string
                severity_threshold:
                  type: number
                  format: float
                duration_minutes:
                  type: integer
            deploy:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                sha:
                  type: string
                deployed_at:
                  type: string
                  format: date-time

    AnomalyEventsListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            anomaly_events:
              type: array
              items:
                $ref: '#/components/schemas/AnomalyEvent'
          required:
            - anomaly_events
      required:
        - header
        - results

    AnomalyEventDetailResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            anomaly_event:
              $ref: '#/components/schemas/AnomalyEventDetail'
          required:
            - anomaly_event
      required:
        - header
        - results

    InsightTimeframe:
      type: object
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_minutes:
          type: integer
      required:
        - start_time
        - end_time
        - duration_minutes

    InsightSummary:
      type: object
      properties:
        count:
          type: integer
          description: Total number of insights
        new_count:
          type: integer
          description: Number of new insights
        items:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - count
        - new_count
        - items

    InsightsResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            timeframe:
              $ref: '#/components/schemas/InsightTimeframe'
            insights:
              type: object
              properties:
                n_plus_one:
                  $ref: '#/components/schemas/InsightSummary'
                memory_bloat:
                  $ref: '#/components/schemas/InsightSummary'
                slow_query:
                  $ref: '#/components/schemas/InsightSummary'
          required:
            - timeframe
            - insights
      required:
        - header
        - results

    InsightTypeResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            timeframe:
              $ref: '#/components/schemas/InsightTimeframe'
            total_count:
              type: integer
              description: Total number of insights
            insight_type:
              type: string
              enum: [n_plus_one, memory_bloat, slow_query]
            new_count:
              type: integer
              description: Number of new insights
            items:
              type: object
              additionalProperties: true
          required:
            - timeframe
            - items
            - total_count
            - insight_type
            - new_count
      required:
        - header
        - results

    InsightHistory:
      type: object
      properties:
        id:
          type: integer
          description: Unique insight identifier
        insight_type:
          type: string
          description: Type of insight
          enum: [n_plus_one, memory_bloat, slow_query]
        first_seen_at:
          type: string
          format: date-time
          description: When the insight was first detected
        metric_name:
          type: string
          description: Name of the associated metric
        trace:
          $ref: '#/components/schemas/TraceDetail'
        fields:
          type: object
          additionalProperties: true
          description: Additional insight-specific data
      required:
        - id
        - first_seen_at
        - insight_type
        - metric_name
        - fields

    InsightHistoryPagination:
      type: object
      properties:
        has_more:
          type: boolean
          description: Whether more results are available
        pagination_cursor:
          type: integer
          nullable: true
          description: Cursor for next page of results
        next_pagination_page:
          type: integer
          nullable: true
          description: Next page number
      required:
        - has_more

    InsightsHistoryResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            total_count:
              type: integer
              description: Total number of insights
            insights:
              type: array
              items:
                $ref: '#/components/schemas/InsightHistory'
              description: List of historical insights
            pagination:
              $ref: '#/components/schemas/InsightHistoryPagination'
          required:
            - total_count
            - insights
            - pagination
      required:
        - header
        - results

  responses:
    Forbidden:
      description: Forbidden - Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              header:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 403
                      message:
                        type: string
                        example: "Forbidden, check your API key"
                  apiVersion:
                    type: string
                    example: "0.1"
              results:
                type: object
                example: {}

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              header:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 404
                      message:
                        type: string
                        example: "Record Not Found"
                  apiVersion:
                    type: string
                    example: "0.1"
              results:
                type: object
                example: {}

    UnprocessableEntity:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              header:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 422
                      message:
                        type: string
                        example: "Invalid timeframe parameters"
                  apiVersion:
                    type: string
                    example: "0.1"
              results:
                type: object
                example: {}

