                type: string
                enum: [throughput, execution_time, latency, errors, allocations]
          required:
            - availableMetrics
      required:
        - header
        - results

    JobTrace:
      type: object
      properties:
        id:
          type: integer
        time:
          type: string
          format: date-time
        duration:
          type: number
