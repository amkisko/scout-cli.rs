        hostname:
          type: string
          nullable: true
          description: Only present in v2 traces
        time:
          type: string
          format: date-time
        total_call_time:
          type: number
        mem_delta:
          type: number
          nullable: true
        metric_name:
          type: string
        uri:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        git_sha:
          type: string
          nullable: true
        allocations_count:
          type: integer
          nullable: true
        limited:
          type: boolean
          description: Indicates if the trace was limited due too many spans
        spans:
          type: array
          items:
            type: object
            additionalProperties: true

    TraceDetailResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            trace:
              $ref: '#/components/schemas/TraceDetail'
          required:
            - trace
      required:
        - header
        - results

    ErrorGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
        status:
          type: string
        errors_count:
          type: integer
        last_error_at:
          type: string
          format: date-time
        request_components:
          type: array
          items:
            type: string
        request_uri:
          type: string
          nullable: true
        app_environment:
          type: string
          nullable: true

    ErrorGroupsListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            error_groups:
              type: array
              items:
                $ref: '#/components/schemas/ErrorGroup'
          required:
            - error_groups
      required:
        - header
        - results
  

    ErrorGroupDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorGroup'
