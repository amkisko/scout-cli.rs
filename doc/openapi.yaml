          required: [latest_error]

    ErrorGroupDetailResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            error_group:
              $ref: '#/components/schemas/ErrorGroupDetail'
          required:
            - error_group
      required:
        - header
        - results

    Error:
      type: object
      properties:
