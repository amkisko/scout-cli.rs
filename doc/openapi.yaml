        name:
          type: string
          description: Job class name
        queue:
          type: string
          description: Queue name
        metric_name:
          type: string
        context:
          type: object
          additionalProperties: true

    JobTracesListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            traces:
              type: array
              items:
                $ref: '#/components/schemas/JobTrace'
          required:
            - traces
      required:
        - header
        - results

    Trace:
      type: object
      properties:
        id:
          type: integer
        time:
          type: string
          format: date-time
        total_call_time:
          type: number
        mem_delta:
          type: number
          nullable: true
        metric_name:
          type: string
        uri:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true

    TracesListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            traces:
              type: array
              items:
                $ref: '#/components/schemas/Trace'
          required:
            - traces
      required:
        - header
        - results

    TraceDetail:
      type: object
      properties:
        id:
          type: integer
        transaction_id:
          type: string
          nullable: true
