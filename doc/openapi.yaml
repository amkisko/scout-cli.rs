openapi: 3.0.3
info:
  title: Scout APM API
  description: Scout APM API for accessing application performance monitoring data
  version: "0.1"
  contact:
    name: Scout APM Support
    url: https://www.scoutapm.com
    email: support@scoutapm.com

servers:
  
  - url: https://scoutapm.com/api/v0
    description: Production API server
  

security:
  - apiKeyHeader: []

paths:
  /apps:
    get:
      summary: List all applications
      description: Returns a list of all applications accessible with the provided API key
      operationId: listApps
      tags:
        - Applications
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /apps/{id}:
    get:
      summary: Get application details
      description: Returns details for a specific application
      operationId: getApp
      tags:
        - Applications
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/metrics:
    get:
      summary: List available metrics
      description: Returns a list of available metric types for the application
      operationId: listMetrics
      tags:
        - Metrics
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/metrics/{metric_type}:
    get:
      summary: Get metric data
      description: Returns time-series data for a specific metric type
      operationId: getMetric
      tags:
        - Metrics
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDataResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/endpoints:
    get:
      summary: List application endpoints
      description: >
        Returns a list of endpoints for the application.


        With no `sort_by`/`limit`/`offset` parameters the full listing is
        returned as an array in `results` (original ordering preserved), exactly
        as before. When any of those parameters is supplied, `results` becomes an
        object with `endpoints`, `count`, `total_count`, and `has_more` for
        pagination.
      operationId: listEndpoints
      tags:
        - Endpoints
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
        - $ref: '#/components/parameters/EndpointSortBy'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: >
            Successful response. The `results` shape depends on whether
            pagination parameters were supplied (see the operation description).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EndpointsListResponse'
                  - $ref: '#/components/schemas/PaginatedEndpointsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/endpoints/{endpoint}/metrics/{metric_type}:
    get:
      summary: Get endpoint metrics
      description: Returns metric data for a specific endpoint
      operationId: getEndpointMetrics
      tags:
        - Endpoints
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Endpoint'
        - $ref: '#/components/parameters/MetricType'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDataResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/endpoints/{endpoint}/traces:
    get:
      summary: List traces for endpoint
      description: Returns traces for a specific endpoint (max 100, within 7 days)
      operationId: listEndpointTraces
      tags:
        - Traces
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Endpoint'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracesListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/jobs:
    get:
      summary: List background jobs
      description: Returns a list of all background jobs for the application with performance metrics
      operationId: listJobs
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/jobs/{job_id}/metrics:
    get:
      summary: List available job metrics
      description: Returns a list of available metric types for background jobs
      operationId: listJobMetrics
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobMetricsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/jobs/{job_id}/metrics/{metric_type}:
    get:
      summary: Get job metrics
      description: Returns metric data for a specific background job
      operationId: getJobMetrics
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/JobMetricType'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricDataResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/jobs/{job_id}/traces:
    get:
      summary: List traces for job
      description: Returns traces for a specific background job (max 100, within 7 days)
      operationId: listJobTraces
      tags:
        - Jobs
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTracesListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/traces/{trace_id}:
    get:
      summary: Get trace details
      description: Returns detailed information for a specific trace
      operationId: getTrace
      tags:
        - Traces
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: trace_id
          in: path
          required: true
          description: Trace identifier
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/error_groups:
    get:
      summary: List error groups
      description: Returns error groups for the application (max 100, within 30 days)
      operationId: listErrorGroups
      tags:
        - Errors
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
        - name: endpoint
          in: query
          required: false
          description: Base64 URL-encoded endpoint or job filter (e.g., Y29udHJvbGxlci9hY3Rpb24= [controller/action])
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorGroupsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/error_groups/{error_id}:
    get:
      summary: Get error group details
      description: Returns details for a specific error group
      operationId: getErrorGroup
      tags:
        - Errors
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: error_id
          in: path
          required: true
          description: Error group identifier
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorGroupDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/error_groups/{error_id}/errors:
    get:
      summary: Get errors in group
      description: Returns individual errors within an error group (max 100)
      operationId: getErrorGroupErrors
      tags:
        - Errors
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: error_id
          in: path
          required: true
          description: Error group identifier
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/anomaly_events:
    get:
      summary: List anomaly events
      description: Returns anomaly events for the application overlapping the given timeframe (max 100, within 30 days)
      operationId: listAnomalyEvents
      tags:
        - Anomalies
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/FromTimestamp'
        - $ref: '#/components/parameters/ToTimestamp'
        - name: state
          in: query
          required: false
          description: Filter by event state
          schema:
            type: string
            enum: [open, closed, all]
            default: all
        - name: metric
          in: query
          required: false
          description: Filter by metric (e.g., response_time, error_rate)
          schema:
            type: string
        - name: endpoint
          in: query
          required: false
          description: Filter by endpoint name (exact match)
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyEventsListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/anomaly_events/{anomaly_event_id}:
    get:
      summary: Get anomaly event details
      description: Returns details for a specific anomaly event, including joined smart monitor and deploy context
      operationId: getAnomalyEvent
      tags:
        - Anomalies
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: anomaly_event_id
          in: path
          required: true
          description: Anomaly event identifier
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyEventDetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/insights:
    get:
      summary: Get current insights
      description: Returns all insight types for the application (cached for 5 minutes)
      operationId: getAllInsights
      tags:
        - Insights
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: limit
          in: query
          required: false
          description: Maximum number of items per insight type
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/insights/{type}:
    get:
      summary: Get current insights by type
      description: Returns data for a specific insight type
      operationId: getInsightByType
      tags:
        - Insights
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/InsightType'
        - name: limit
          in: query
          required: false
          description: Maximum number of items
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightTypeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /apps/{id}/insights/history:
    get:
      summary: Get insights history
      description: Returns historical insights data with cursor-based pagination
      operationId: getInsightsHistory
      tags:
        - Insights
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/ToTimestamp'
        - $ref: '#/components/parameters/FromTimestamp'
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page
          schema:
            type: integer
            default: 10
        - name: pagination_cursor
          in: query
          required: false
          description: Cursor for pagination (insight ID)
          schema:
            type: integer
        - name: pagination_direction
          in: query
          required: false
          description: Pagination direction
          schema:
            type: string
            enum: [forward, backward]
            default: forward
        - name: pagination_page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsHistoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /apps/{id}/insights/history/{type}:
    get:
      summary: Get insights history by type
      description: Returns historical insights data filtered by insight type with cursor-based pagination
      operationId: getInsightsHistoryByType
      tags:
        - Insights
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/InsightType'
        - $ref: '#/components/parameters/ToTimestamp'
        - $ref: '#/components/parameters/FromTimestamp'
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page
          schema:
            type: integer
            default: 10
        - name: pagination_cursor
          in: query
          required: false
          description: Cursor for pagination (insight ID)
          schema:
            type: integer
        - name: pagination_direction
          in: query
          required: false
          description: Pagination direction
          schema:
            type: string
            enum: [forward, backward]
            default: forward
        - name: pagination_page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsHistoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-SCOUT-API
      description: API key provided in request header

  parameters:
    AppId:
      name: id
      in: path
      required: true
      description: Application identifier
      schema:
        type: integer
        example: 1234

    MetricType:
      name: metric_type
      in: path
      required: true
      description: Type of metric to retrieve
      schema:
        type: string
        enum: [apdex, response_time, response_time_95th, errors, throughput, queue_time]

    Endpoint:
      name: endpoint
      in: path
      required: true
      description: Base64 URL-encoded endpoint identifier (e.g., Y29udHJvbGxlci9hY3Rpb24= [controller/action])
      schema:
        type: string

    FromTimestamp:
      name: from
      in: query
      required: true
      description: Start time in ISO 8601 format
      schema:
        type: string
        format: date-time
        example: 2026-07-14T11:16:49Z

    ToTimestamp:
      name: to
      in: query
      required: true
      description: End time in ISO 8601 format
      schema:
        type: string
        format: date-time
        example: 2026-07-15T11:16:49Z

    EndpointSortBy:
      name: sort_by
      in: query
      required: false
      description: >
        Sort the listing in descending order by this field. Omit to preserve the
        listing's natural ordering. Supplying this switches the response to the
        paginated shape.
      schema:
        type: string
        enum: [time_consumed, response_time, throughput, error_rate]

    Limit:
      name: limit
      in: query
      required: false
      description: >
        Maximum number of endpoints to return. Omit for the full listing (no
        default limit). Supplying this switches the response to the paginated
        shape.
      schema:
        type: integer
        minimum: 1
        example: 50

    Offset:
      name: offset
      in: query
      required: false
      description: >
        Number of endpoints to skip, for pagination. Supplying this switches the
        response to the paginated shape.
      schema:
        type: integer
        minimum: 0
        default: 0

    JobId:
      name: job_id
      in: path
      required: true
      description: Base64 URL-encoded job identifier (e.g., ZGVmYXVsdC9EdW1teVdvcmtlcg== [default/DummyWorker])
      schema:
        type: string

    JobMetricType:
      name: metric_type
      in: path
      required: true
      description: Type of job metric to retrieve
      schema:
        type: string
        enum: [throughput, execution_time, latency, errors, allocations]

    InsightType:
      name: type
      in: path
      required: true
      description: Insight type
      schema:
        type: string
        enum: [n_plus_one, memory_bloat, slow_query]

  schemas:
    StandardHeader:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: integer
              example: 200
            message:
              type: string
              example: "OK"
          required:
            - code
            - message
        apiVersion:
          type: string
          example: "0.1"
      required:
        - status
        - apiVersion

    App:
      type: object
      properties:
        id:
          type: integer
          example: 1234
        name:
          type: string
          example: "My Application"
        last_reported_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name

    AppsListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            apps:
              type: array
              items:
                $ref: '#/components/schemas/App'
          required:
            - apps
      required:
        - header
        - results

    AppDetailResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            app:
              $ref: '#/components/schemas/App'
          required:
            - app
      required:
        - header
        - results

    MetricsListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            availableMetrics:
              type: array
              items:
                type: string
                enum: [apdex, response_time, response_time_95th, errors, throughput, queue_time]
          required:
            - availableMetrics
      required:
        - header
        - results

    MetricDataResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            summaries:
              type: object
              additionalProperties:
                type: object
                description: Summary statistics for the metric
            series:
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                    value:
                      type: number
      required:
        - header
        - results

    Endpoint:
      type: object
      properties:
        name:
          type: string
          example: "UsersController#index"
        95th_percentile:
          type: number
          nullable: true
        percentage_of_total: 
          type: number
        formatted_method_name:
          type: string
        throughput:
          type: number
        response_time:
          type: number
        error_rate:
          type: number
        max_allocations:
          type: integer
          nullable: true
        link:
          type: string
          example: "/apps/1234/endpoints/UsersController"
      required:
        - name
        - 95th_percentile
        - max_allocations
        - response_time
        - formatted_method_name
        - throughput
        - error_rate
        - link

    EndpointsListResponse:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
      required:
        - header
        - results

    PaginatedEndpointsListResponse:
      type: object
      description: >
        Returned when any of sort_by/limit/offset is supplied.
      properties:
        header:
          $ref: '#/components/schemas/StandardHeader'
        results:
          type: object
          properties:
            endpoints:
              type: array
              items:
                $ref: '#/components/schemas/Endpoint'
            count:
              type: integer
              description: Number of endpoints in this page
            total_count:
              type: integer
              description: Total number of endpoints across all pages
            has_more:
              type: boolean
              description: Whether more endpoints exist beyond this page
          required:
            - endpoints
            - count
            - total_count
            - has_more
      required:
        - header
        - results

    Job:
      type: object
      properties:
        full_name:
          type: string
          example: "default/DummyWorker"
        name:
          type: string
          example: "DummyWorker"
        queue:
          type: string
          example: "default"
        job_id:
          type: string
          description: Base64 URL-encoded job identifier for use with other endpoints
        throughput:
          type: number
          description: Jobs per minute
        execution_time:
          type: number
          description: Average execution time in milliseconds
        time_consumed:
          type: number
          description: Fraction of total job time consumed by this job
        latency:
          type: number
          description: Average queue latency in seconds
      required:
        - full_name
        - name
        - queue
        - throughput
        - execution_time

    JobsListResponse:
      type: object
      properties:
        header:
