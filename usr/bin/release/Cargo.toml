[package]
name = "release"
version = "0.3.0"
edition = "2021"
publish = false
description = "Release tooling for scout-cli (packaging sync, format, clippy, test, tag, publish)"
default-run = "release"

[lib]
name = "release"
path = "lib.rs"

[[bin]]
name = "release"
path = "release.rs"

[[bin]]
name = "sync-packaging"
path = "sync_packaging.rs"

[[bin]]
name = "check-loc"
path = "check_loc.rs"
